<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#111827"/>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#f9fafb}.sub{font:500 18px system-ui,sans-serif;fill:#9ca3af}.head{font:700 20px system-ui,sans-serif;fill:#f9fafb}.text{font:500 16px system-ui,sans-serif;fill:#d1d5db}.small{font:500 14px system-ui,sans-serif;fill:#9ca3af}.accent{font:700 16px system-ui,sans-serif;fill:#f9fafb}.muted{font:500 16px system-ui,sans-serif;fill:#6b7280}.box{fill:#1f2937;stroke:#374151;stroke-width:2}.inner{fill:#111827;stroke:#374151;stroke-width:1}.selected{fill:#374151;stroke:#9ca3af;stroke-width:2}.button{fill:#374151;stroke:#6b7280;stroke-width:1}.trade{fill:#4b5563;stroke:#9ca3af;stroke-width:1}
  </style>
  <text x="70" y="65" class="title">Seedvale — Merchant Trade UI/UX Reference</text>
  <text x="70" y="96" class="sub">C1 Desktop · M1 Mobile Landscape Drawer · A2 Selection</text>

  <!-- Desktop -->
  <text x="70" y="145" class="head">DESKTOP — C1</text>
  <rect x="70" y="170" width="1460" height="355" rx="12" class="box"/>
  <line x1="555" y1="170" x2="555" y2="525" stroke="#374151"/>
  <line x1="1040" y1="170" x2="1040" y2="525" stroke="#374151"/>

  <text x="100" y="205" class="head">BUY</text>
  <rect x="100" y="220" width="410" height="38" rx="6" class="inner"/>
  <text x="115" y="245" class="small">Search   ·   Weapons   ·   Price ↑</text>
  <rect x="100" y="275" width="410" height="42" rx="6" class="selected"/>
  <text x="115" y="301" class="accent">✓ Iron Sword</text><text x="455" y="301" text-anchor="end" class="text">35</text>
  <text x="115" y="340" class="text">Steel Axe</text><text x="455" y="340" text-anchor="end" class="text">42</text>
  <text x="115" y="375" class="text">Hunting Bow</text><text x="455" y="375" text-anchor="end" class="text">28</text>
  <rect x="100" y="405" width="410" height="42" rx="6" class="button"/>
  <text x="115" y="431" class="text">−   1   +</text><text x="490" y="431" text-anchor="end" class="accent">ADD</text>
  <text x="100" y="482" class="small">(i) opens Item Details</text>

  <text x="585" y="205" class="head">OFFER</text>
  <rect x="585" y="220" width="410" height="38" rx="6" class="inner"/>
  <text x="600" y="245" class="small">Search   ·   Vegetables   ·   Name</text>
  <rect x="585" y="275" width="410" height="42" rx="6" class="selected"/>
  <text x="600" y="301" class="accent">✓ Carrot</text><text x="940" y="301" text-anchor="end" class="text">0.6</text>
  <text x="600" y="340" class="text">Cabbage</text><text x="940" y="340" text-anchor="end" class="text">0.8</text>
  <text x="600" y="375" class="text">Potato</text><text x="940" y="375" text-anchor="end" class="text">0.5</text>
  <rect x="585" y="405" width="410" height="42" rx="6" class="button"/>
  <text x="600" y="431" class="text">−   20   +</text><text x="975" y="431" text-anchor="end" class="accent">ADD</text>
  <text x="585" y="482" class="small">BUY/OFFER filters are independent</text>

  <text x="1070" y="205" class="head">TRANSACTION</text>
  <text x="1070" y="240" class="small">BUY</text>
  <text x="1070" y="266" class="text">Iron Sword ×1</text><text x="1500" y="266" text-anchor="end" class="text">35</text>
  <text x="1070" y="302" class="small">OFFER</text>
  <text x="1070" y="328" class="text">Carrot ×20</text><text x="1500" y="328" text-anchor="end" class="text">−12</text>
  <line x1="1070" y1="350" x2="1500" y2="350" stroke="#374151"/>
  <text x="1070" y="380" class="text">To pay</text><text x="1500" y="380" text-anchor="end" class="accent">23 🪙</text>
  <text x="1070" y="407" class="text">Your coins</text><text x="1500" y="407" text-anchor="end" class="text">80 🪙</text>
  <text x="1070" y="434" class="text">After trade</text><text x="1500" y="434" text-anchor="end" class="text">57 🪙</text>
  <rect x="1340" y="460" width="160" height="40" rx="7" class="trade"/>
  <text x="1420" y="486" text-anchor="middle" class="accent">TRADE</text>

  <!-- Mobile -->
  <text x="70" y="585" class="head">MOBILE — M1 · LANDSCAPE · DRAWER</text>
  <rect x="70" y="610" width="1460" height="320" rx="12" class="box"/>
  <text x="100" y="645" class="head">BUY / OFFER</text>
  <rect x="100" y="660" width="180" height="38" rx="6" class="selected"/>
  <text x="190" y="685" text-anchor="middle" class="accent">BUY</text>
  <rect x="285" y="660" width="180" height="38" rx="6" class="button"/>
  <text x="375" y="685" text-anchor="middle" class="text">OFFER</text>
  <rect x="100" y="715" width="540" height="38" rx="6" class="inner"/>
  <text x="115" y="740" class="small">Weapons   ·   Price ↑   ·   Search</text>
  <text x="115" y="785" class="text">✓ Iron Sword</text><text x="610" y="785" text-anchor="end" class="text">35</text>
  <text x="115" y="820" class="text">Steel Axe</text><text x="610" y="820" text-anchor="end" class="text">42</text>
  <text x="115" y="855" class="text">Hunting Bow</text><text x="610" y="855" text-anchor="end" class="text">28</text>
  <text x="115" y="895" class="small">A2: selected items stay in the list; state is preserved</text>

  <!-- Drawer -->
  <rect x="930" y="625" width="560" height="280" rx="12" class="selected"/>
  <text x="960" y="660" class="head">TRANSACTION DRAWER</text>
  <text x="960" y="692" class="small">BUY</text>
  <text x="960" y="718" class="text">Iron Sword ×1</text><text x="1455" y="718" text-anchor="end" class="text">35</text>
  <text x="960" y="750" class="small">OFFER</text>
  <text x="960" y="776" class="text">Carrot ×20</text><text x="1455" y="776" text-anchor="end" class="text">−12</text>
  <line x1="960" y1="792" x2="1455" y2="792" stroke="#374151"/>
  <text x="960" y="820" class="text">To pay</text><text x="1455" y="820" text-anchor="end" class="accent">23 🪙</text>
  <text x="960" y="847" class="text">Coins after</text><text x="1455" y="847" text-anchor="end" class="text">57 🪙</text>
  <rect x="1280" y="855" width="175" height="38" rx="7" class="trade"/>
  <text x="1367" y="880" text-anchor="middle" class="accent">TRADE</text>
</svg>
