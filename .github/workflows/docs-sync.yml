name: Docs Sync

on:
  push:
    branches:
      - main
    paths:
      - "docs/plans/**"
      - "scripts/docs/**"
      - "package.json"
      - ".github/workflows/docs-sync.yml"

permissions:
  contents: write

concurrency:
  group: docs-sync-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync generated docs
        run: pnpm run docs:sync:ci

      - name: Commit generated changes
        run: |
          if git diff --quiet -- docs/; then
            echo "No generated documentation changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/
          git commit -m "chore(docs): sync generated documentation [skip ci]"
          git push
