<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedvale</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="theme-color" content="#87b5d4" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87b5d4;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }
      .seedvale-hud {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 5;
        color: #f2f6fa;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        user-select: none;
      }
      .seedvale-hud__time {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .seedvale-hud__meta {
        margin-top: 2px;
        font-size: 13px;
        opacity: 0.9;
        display: flex;
        gap: 12px;
      }
      .seedvale-hud__hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
      }
      .seedvale-minimap {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 5;
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 4px;
      }
      .seedvale-minimap__canvas {
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      .seedvale-minimap__canvas[hidden] {
        display: none;
      }
      .seedvale-minimap__toggle {
        padding: 2px 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f2f6fa;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-minimap__toggle:hover {
        background: rgba(20, 24, 28, 0.9);
      }
      .seedvale-pause {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-pause[hidden] {
        display: none;
      }
      .seedvale-pause__panel {
        min-width: 280px;
        padding: 28px 32px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-pause__panel h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .seedvale-pause__section {
        text-align: left;
        margin-bottom: 20px;
      }
      .seedvale-pause__subtitle {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin-bottom: 8px;
      }
      .seedvale-pause__label {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      .seedvale-pause__input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
      }
      .seedvale-pause__input:focus {
        outline: none;
        border-color: #4a89e0;
        background: rgba(255, 255, 255, 0.1);
      }
      .seedvale-pause__row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 20px;
      }
      .seedvale-pause__button {
        display: block;
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: #3d7bd1;
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-pause__button:hover {
        background: #4a89e0;
      }
      .seedvale-pause__button--ghost {
        background: transparent;
      }
      .seedvale-pause__button--ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-pause__button--danger {
        background: transparent;
        border-color: rgba(217, 92, 92, 0.4);
        color: #e08585;
      }
      .seedvale-pause__button--danger:hover {
        background: rgba(217, 92, 92, 0.12);
      }
      .seedvale-pause__save-status {
        margin-left: 8px;
        font-size: 12px;
        opacity: 0.75;
      }
      .seedvale-pause__hint {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #87b5d4;
        transition: opacity 0.3s ease;
      }
      .seedvale-loading--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .seedvale-loading__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(20, 24, 28, 0.2);
        border-top-color: rgba(20, 24, 28, 0.75);
        animation: seedvale-spin 0.8s linear infinite;
      }
      .seedvale-loading__text {
        color: #14181c;
        font-size: 14px;
        opacity: 0.75;
        letter-spacing: 0.02em;
      }
      @keyframes seedvale-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .seedvale-interact-prompt {
        position: absolute;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        z-index: 6;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 13px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
      .seedvale-interact-prompt[hidden] {
        display: none;
      }
      .seedvale-npc-dialog {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 80px;
        background: rgba(10, 14, 18, 0.25);
      }
      .seedvale-npc-dialog[hidden] {
        display: none;
      }
      .seedvale-npc-dialog__panel {
        min-width: 320px;
        max-width: 480px;
        padding: 20px 24px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-npc-dialog__name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      .seedvale-npc-dialog__line {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.92;
      }
      .seedvale-npc-dialog__hint {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-quest-log {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-quest-log[hidden] {
        display: none;
      }
      .seedvale-quest-log__panel {
        min-width: 360px;
        max-width: 480px;
        max-height: 70vh;
        overflow-y: auto;
        padding: 24px 28px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-quest-log__panel h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .seedvale-quest-log__exp {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 16px;
      }
      .seedvale-quest-log__filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .seedvale-quest-log__filter {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: transparent;
        color: #f2f6fa;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        opacity: 0.75;
      }
      .seedvale-quest-log__filter:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-quest-log__filter--active {
        background: #3d7bd1;
        opacity: 1;
      }
      .seedvale-quest-log__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seedvale-quest-log__row {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }
      .seedvale-quest-log__row-title {
        font-size: 14px;
        font-weight: 600;
      }
      .seedvale-quest-log__row-state {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }
      .seedvale-quest-log__row-relation {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 4px;
      }
      .seedvale-quest-log__empty {
        font-size: 13px;
        opacity: 0.6;
      }
      .seedvale-quest-log__hint {
        margin-top: 16px;
        font-size: 11px;
        opacity: 0.6;
      }
      .npc-label {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 11px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
