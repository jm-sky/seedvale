<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Seedvale</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="theme-color" content="#87b5d4" />
    <!-- iOS only honors "Add to Home Screen" fullscreen/standalone mode via
         these meta tags (the web manifest's display:standalone is Android/
         Chrome-only) — no effect on Android or in a regular browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seedvale" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #87b5d4;
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* touch-action is intentionally NOT set to none on html/body: the used
         value for gesture handling is the *intersection* of an element's own
         touch-action with every ancestor's, so a blanket none up at body would
         silently defeat overflow-y:auto touch-drag scrolling on any modal panel
         below (pause menu, quest log, villagers, npc dialog) regardless of what
         those panels set on themselves. Gameplay-area gestures (pinch-zoom/pan
         over the 3D view) are blocked per-element instead: canvas above, and
         .seedvale-touch__look/.seedvale-touch__joystick below, which together
         already cover the entire screen during play. */
      .seedvale-rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        touch-action: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: rgba(10, 14, 18, 0.94);
        color: #f2f6fa;
        text-align: center;
        padding: 24px;
      }
      .seedvale-rotate-hint__icon {
        font-size: 40px;
      }
      .seedvale-rotate-hint__text {
        font-size: 15px;
        opacity: 0.85;
        max-width: 260px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .seedvale-rotate-hint {
          display: flex;
        }
      }
      .seedvale-hud {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 5;
        color: #f2f6fa;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        user-select: none;
      }
      .seedvale-hud__time {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .seedvale-hud__meta {
        margin-top: 2px;
        font-size: 13px;
        opacity: 0.9;
        display: flex;
        gap: 12px;
      }
      .seedvale-hud__hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
      }
      .seedvale-minimap {
        position: absolute;
        bottom: 10px;
        left: 10px;
        /* Above .seedvale-touch's full-screen look-drag layer (z-index 7) so its
           collapse toggle stays tappable on touch devices. */
        z-index: 8;
        touch-action: none;
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 4px;
      }
      .seedvale-minimap__canvas {
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      .seedvale-minimap__canvas[hidden] {
        display: none;
      }
      .seedvale-minimap__toggle {
        padding: 2px 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f2f6fa;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-minimap__toggle:hover {
        background: rgba(20, 24, 28, 0.9);
      }
      .seedvale-pause {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-pause[hidden] {
        display: none;
      }
      .seedvale-pause__panel {
        min-width: 280px;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 28px 32px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-pause__panel h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .seedvale-pause__section {
        text-align: left;
        margin-bottom: 20px;
      }
      .seedvale-pause__subtitle {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin-bottom: 8px;
      }
      .seedvale-pause__label {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      .seedvale-pause__input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
      }
      .seedvale-pause__input:focus {
        outline: none;
        border-color: #4a89e0;
        background: rgba(255, 255, 255, 0.1);
      }
      .seedvale-pause__row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 20px;
      }
      .seedvale-pause__button {
        display: block;
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: #3d7bd1;
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-pause__button:hover {
        background: #4a89e0;
      }
      .seedvale-pause__button--ghost {
        background: transparent;
      }
      .seedvale-pause__button--ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-pause__button--danger {
        background: transparent;
        border-color: rgba(217, 92, 92, 0.4);
        color: #e08585;
      }
      .seedvale-pause__button--danger:hover {
        background: rgba(217, 92, 92, 0.12);
      }
      .seedvale-pause__save-status {
        margin-left: 8px;
        font-size: 12px;
        opacity: 0.75;
      }
      .seedvale-pause__hint {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        touch-action: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #87b5d4;
        transition: opacity 0.3s ease;
      }
      .seedvale-loading--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .seedvale-loading__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(20, 24, 28, 0.2);
        border-top-color: rgba(20, 24, 28, 0.75);
        animation: seedvale-spin 0.8s linear infinite;
      }
      .seedvale-loading__text {
        color: #14181c;
        font-size: 14px;
        opacity: 0.75;
        letter-spacing: 0.02em;
      }
      @keyframes seedvale-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .seedvale-interact-prompt {
        position: absolute;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        z-index: 6;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 13px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
      .seedvale-interact-prompt[hidden] {
        display: none;
      }
      .seedvale-npc-dialog {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 80px;
        background: rgba(10, 14, 18, 0.25);
      }
      .seedvale-npc-dialog[hidden] {
        display: none;
      }
      .seedvale-npc-dialog__panel {
        min-width: 320px;
        max-width: 480px;
        max-height: calc(100dvh - 112px);
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 20px 24px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-npc-dialog__name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      .seedvale-npc-dialog__line {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.92;
      }
      .seedvale-npc-dialog__hint {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-quest-log {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-quest-log[hidden] {
        display: none;
      }
      .seedvale-quest-log__panel {
        min-width: 360px;
        max-width: 480px;
        max-height: 70vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 24px 28px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-quest-log__panel h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .seedvale-quest-log__exp {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 16px;
      }
      .seedvale-quest-log__filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .seedvale-quest-log__filter {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: transparent;
        color: #f2f6fa;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        opacity: 0.75;
      }
      .seedvale-quest-log__filter:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-quest-log__filter--active {
        background: #3d7bd1;
        opacity: 1;
      }
      .seedvale-quest-log__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seedvale-quest-log__row {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }
      .seedvale-quest-log__row-title {
        font-size: 14px;
        font-weight: 600;
      }
      .seedvale-quest-log__row-state {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }
      .seedvale-quest-log__row-objective {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 4px;
        font-style: italic;
      }
      .seedvale-quest-log__row-relation {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 4px;
      }
      .seedvale-quest-log__empty {
        font-size: 13px;
        opacity: 0.6;
      }
      .seedvale-quest-log__hint {
        margin-top: 16px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-villagers {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-villagers[hidden] {
        display: none;
      }
      .seedvale-villagers__panel {
        min-width: 360px;
        max-width: 480px;
        max-height: 70vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 24px 28px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-villagers__panel h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 16px;
      }
      .seedvale-villagers__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seedvale-villagers__row {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }
      .seedvale-villagers__row-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .seedvale-villagers__row-name {
        font-size: 14px;
        font-weight: 600;
      }
      .seedvale-villagers__row-role {
        font-size: 12px;
        opacity: 0.7;
      }
      .seedvale-villagers__row-meta {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 2px;
      }
      .seedvale-villagers__row-settlement {
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 8px;
        background: rgba(224, 179, 74, 0.25);
        font-size: 11px;
        opacity: 0.85;
      }
      .seedvale-villagers__hp {
        margin-top: 6px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .seedvale-villagers__hp-fill {
        height: 100%;
        background: #5faa3a;
        transition: width 0.2s ease;
      }
      .seedvale-villagers__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .seedvale-villagers__tag {
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(61, 123, 209, 0.35);
        font-size: 11px;
      }
      .seedvale-villagers__tag--muted {
        background: rgba(255, 255, 255, 0.08);
        opacity: 0.6;
      }
      .seedvale-villagers__empty {
        font-size: 13px;
        opacity: 0.6;
      }
      .seedvale-villagers__hint {
        margin-top: 16px;
        font-size: 11px;
        opacity: 0.6;
      }
      .npc-label {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 11px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
      .npc-label--highlighted {
        /* box-shadow (not border) so the glow never shifts label layout/position. */
        box-shadow:
          0 0 0 1px rgba(255, 196, 92, 0.9),
          0 0 10px 2px rgba(255, 196, 92, 0.5);
      }

      /* --- Touch controls (joystick / look-drag / action buttons) --- */
      .seedvale-touch {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }
      .seedvale-touch__look {
        position: absolute;
        inset: 0;
        touch-action: none;
        pointer-events: auto;
      }
      .seedvale-touch__joystick {
        position: absolute;
        left: max(20px, env(safe-area-inset-left));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(20, 24, 28, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        touch-action: none;
        pointer-events: auto;
      }
      .seedvale-touch__joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin-left: -25px;
        margin-top: -25px;
        border-radius: 50%;
        background: rgba(242, 246, 250, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.35);
        pointer-events: none;
        will-change: transform;
      }
      .seedvale-touch__buttons {
        position: absolute;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .seedvale-touch__button {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(20, 24, 28, 0.6);
        color: #f2f6fa;
        font-size: 15px;
        font-family: inherit;
        font-weight: 600;
        touch-action: manipulation;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .seedvale-touch__button--primary {
        width: 68px;
        height: 68px;
        font-size: 18px;
        background: rgba(61, 123, 209, 0.75);
      }
      .seedvale-touch__button--sprint {
        font-size: 11px;
      }
      .seedvale-touch__button--sprint.seedvale-touch__button--active {
        background: rgba(224, 179, 74, 0.75);
        border-color: rgba(224, 179, 74, 0.9);
      }
      .seedvale-touch__pause {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(20, 24, 28, 0.6);
        color: #f2f6fa;
        font-size: 18px;
        font-family: inherit;
        touch-action: manipulation;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      /* While a full-screen modal (pause menu, quest log, ...) is open, the
         touch layer sits underneath it (z-index 7 < modal z-index) but taps can
         still land on its buttons on some mobile browsers — this hard-disables
         the whole layer so a tap meant for the modal can never also toggle
         RUN/interact/etc. underneath it. Toggled from createApp's tick loop via
         TouchControls.setInputEnabled(). */
      .seedvale-touch--disabled * {
        pointer-events: none !important;
      }

      /* Bottom-left minimap collides with the joystick — move it out of the way.
         Sits beside (not below) the ☰ pause button, same row: on a short
         landscape phone, stacking two 44px-tall controls vertically at the top
         edge pushed the pair down into the bottom-right L/G/RUN/E cluster's
         territory. Side-by-side keeps the whole top-right footprint to one
         44px row regardless of viewport height. */
      body.seedvale-touch .seedvale-minimap {
        left: auto;
        right: max(72px, calc(env(safe-area-inset-right) + 72px));
        bottom: auto;
        top: max(16px, env(safe-area-inset-top));
        flex-direction: column;
      }
      /* Desktop toggle (2px/8px padding, ~11px font) is too small a touch target —
         enlarge it to a comfortable tap size on touch devices. */
      body.seedvale-touch .seedvale-minimap__toggle {
        min-width: 44px;
        min-height: 32px;
        padding: 6px 10px;
        font-size: 14px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      body.seedvale-touch .seedvale-interact-prompt {
        bottom: 160px;
      }

      /* --- Small screens: keep modal panels within the viewport --- */
      @media (max-width: 700px), (max-height: 500px) {
        .seedvale-pause__panel,
        .seedvale-npc-dialog__panel,
        .seedvale-quest-log__panel,
        .seedvale-villagers__panel {
          min-width: 0;
          width: min(420px, calc(100vw - 32px));
          max-width: calc(100vw - 32px);
          max-height: calc(100dvh - 32px);
          padding: 18px 20px;
        }
        .seedvale-hud {
          left: max(12px, env(safe-area-inset-left));
          top: max(12px, env(safe-area-inset-top));
        }
        .seedvale-hud__time {
          font-size: 22px;
        }
        .seedvale-hud__hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="seedvale-rotate-hint">
      <div class="seedvale-rotate-hint__icon">🔄</div>
      <div class="seedvale-rotate-hint__text">Obróć urządzenie poziomo, aby wygodniej sterować postacią.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
