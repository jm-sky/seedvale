<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedvale</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87b5d4;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }
      .seedvale-hud {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 5;
        color: #f2f6fa;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        user-select: none;
      }
      .seedvale-hud__time {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .seedvale-hud__meta {
        margin-top: 2px;
        font-size: 13px;
        opacity: 0.9;
        display: flex;
        gap: 12px;
      }
      .seedvale-hud__hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
      }
      .seedvale-pause {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-pause[hidden] {
        display: none;
      }
      .seedvale-pause__panel {
        min-width: 280px;
        padding: 28px 32px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-pause__panel h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .seedvale-pause__section {
        text-align: left;
        margin-bottom: 20px;
      }
      .seedvale-pause__subtitle {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin-bottom: 8px;
      }
      .seedvale-pause__label {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      .seedvale-pause__input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
      }
      .seedvale-pause__input:focus {
        outline: none;
        border-color: #4a89e0;
        background: rgba(255, 255, 255, 0.1);
      }
      .seedvale-pause__row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 20px;
      }
      .seedvale-pause__button {
        display: block;
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: #3d7bd1;
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-pause__button:hover {
        background: #4a89e0;
      }
      .seedvale-pause__button--ghost {
        background: transparent;
      }
      .seedvale-pause__button--ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-pause__hint {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.6;
      }
      .npc-label {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 11px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
