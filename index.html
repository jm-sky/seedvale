<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seedvale</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87b5d4;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }
      .seedvale-hud {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 5;
        color: #f2f6fa;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        user-select: none;
      }
      .seedvale-hud__time {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .seedvale-hud__meta {
        margin-top: 2px;
        font-size: 13px;
        opacity: 0.9;
        display: flex;
        gap: 12px;
      }
      .seedvale-hud__hint {
        margin-top: 10px;
        font-size: 12px;
        opacity: 0.7;
      }
      .npc-label {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 11px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
