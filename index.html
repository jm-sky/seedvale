<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Seedvale</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="theme-color" content="#87b5d4" />
    <!-- iOS only honors "Add to Home Screen" fullscreen/standalone mode via
         these meta tags (the web manifest's display:standalone is Android/
         Chrome-only) — no effect on Android or in a regular browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seedvale" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #87b5d4;
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      /* touch-action is intentionally NOT set to none on html/body: the used
         value for gesture handling is the *intersection* of an element's own
         touch-action with every ancestor's, so a blanket none up at body would
         silently defeat overflow-y:auto touch-drag scrolling on any modal panel
         below (pause menu, quest log, villagers, npc dialog) regardless of what
         those panels set on themselves. Gameplay-area gestures (pinch-zoom/pan
         over the 3D view) are blocked per-element instead: canvas above, and
         .seedvale-touch__look/.seedvale-touch__joystick below, which together
         already cover the entire screen during play. */
      .seedvale-rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        touch-action: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: rgba(10, 14, 18, 0.94);
        color: #f2f6fa;
        text-align: center;
        padding: 24px;
      }
      .seedvale-rotate-hint__icon {
        font-size: 40px;
      }
      .seedvale-rotate-hint__text {
        font-size: 15px;
        opacity: 0.85;
        max-width: 260px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        .seedvale-rotate-hint {
          display: flex;
        }
      }
      /* Every full-screen modal root re-asserts `pointer-events: auto`: the
         property inherits, so a modal must never depend on no ancestor having
         turned it off (that exact bug made all four modals untappable on
         touch — see the .seedvale-touch note below). */
      .seedvale-pause {
        position: absolute;
        inset: 0;
        z-index: 11;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-pause[hidden] {
        display: none;
      }
      .seedvale-pause__panel {
        min-width: 280px;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 28px 32px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-pause__panel h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .seedvale-pause__section {
        text-align: left;
        margin-bottom: 20px;
      }
      .seedvale-pause__subtitle {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin-bottom: 8px;
      }
      .seedvale-pause__label {
        display: block;
        font-size: 12px;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      .seedvale-pause__input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
      }
      .seedvale-pause__input:focus {
        outline: none;
        border-color: #4a89e0;
        background: rgba(255, 255, 255, 0.1);
      }
      .seedvale-pause__row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 20px;
      }
      .seedvale-pause__button {
        display: block;
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: #3d7bd1;
        color: #f2f6fa;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-pause__button:hover {
        background: #4a89e0;
      }
      .seedvale-pause__button--ghost {
        background: transparent;
      }
      .seedvale-pause__button--ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-pause__button--danger {
        background: transparent;
        border-color: rgba(217, 92, 92, 0.4);
        color: #e08585;
      }
      .seedvale-pause__button--danger:hover {
        background: rgba(217, 92, 92, 0.12);
      }
      .seedvale-pause__save-status {
        margin-left: 8px;
        font-size: 12px;
        opacity: 0.75;
      }
      .seedvale-pause__hint {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-pause__footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 10px;
        line-height: 1.6;
        font-family: monospace;
        opacity: 0.4;
      }
      .seedvale-loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        touch-action: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #87b5d4;
        transition: opacity 0.3s ease;
      }
      .seedvale-loading--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .seedvale-loading__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(20, 24, 28, 0.2);
        border-top-color: rgba(20, 24, 28, 0.75);
        animation: seedvale-spin 0.8s linear infinite;
      }
      .seedvale-loading__text {
        color: #14181c;
        font-size: 14px;
        opacity: 0.75;
        letter-spacing: 0.02em;
      }
      @keyframes seedvale-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .seedvale-interact-prompt {
        position: absolute;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%);
        z-index: 6;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 13px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
      .seedvale-interact-prompt[hidden] {
        display: none;
      }
      .seedvale-npc-dialog {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: auto;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 80px;
        background: rgba(10, 14, 18, 0.25);
      }
      .seedvale-npc-dialog[hidden] {
        display: none;
      }
      .seedvale-npc-dialog__panel {
        min-width: 320px;
        max-width: 480px;
        max-height: calc(100dvh - 112px);
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 20px 24px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-npc-dialog__name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      .seedvale-npc-dialog__line {
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.92;
      }
      .seedvale-npc-dialog__hint {
        margin-top: 14px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-quest-log {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-quest-log[hidden] {
        display: none;
      }
      .seedvale-quest-log__panel {
        min-width: 360px;
        max-width: 480px;
        max-height: 70vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 24px 28px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-quest-log__panel h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .seedvale-quest-log__exp {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 16px;
      }
      .seedvale-quest-log__filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .seedvale-quest-log__filter {
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        background: transparent;
        color: #f2f6fa;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        opacity: 0.75;
      }
      .seedvale-quest-log__filter:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .seedvale-quest-log__filter--active {
        background: #3d7bd1;
        opacity: 1;
      }
      .seedvale-quest-log__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seedvale-quest-log__row {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }
      .seedvale-quest-log__row-title {
        font-size: 14px;
        font-weight: 600;
      }
      .seedvale-quest-log__row-state {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }
      .seedvale-quest-log__row-objective {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 4px;
        font-style: italic;
      }
      .seedvale-quest-log__row-relation {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 4px;
      }
      .seedvale-quest-log__empty {
        font-size: 13px;
        opacity: 0.6;
      }
      .seedvale-quest-log__hint {
        margin-top: 16px;
        font-size: 11px;
        opacity: 0.6;
      }
      .seedvale-inventory {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 18, 0.55);
        backdrop-filter: blur(2px);
      }
      .seedvale-inventory[hidden] {
        display: none;
      }
      .seedvale-inventory__panel {
        min-width: 360px;
        max-width: 480px;
        max-height: 70vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 24px 28px;
        border-radius: 10px;
        background: rgba(20, 24, 28, 0.92);
        color: #f2f6fa;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .seedvale-inventory__panel h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
      }
      .seedvale-inventory__weight {
        font-size: 13px;
        opacity: 0.75;
        margin-bottom: 16px;
      }
      .seedvale-inventory__list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .seedvale-inventory__row {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .seedvale-inventory__row-main {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .seedvale-inventory__row-name {
        font-size: 14px;
        font-weight: 600;
      }
      .seedvale-inventory__row-category {
        font-size: 11px;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .seedvale-inventory__row-weight {
        font-size: 12px;
        opacity: 0.7;
      }
      .seedvale-inventory__drop {
        align-self: flex-start;
        margin-top: 2px;
        padding: 4px 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        background: transparent;
        color: #f2f6fa;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      .seedvale-inventory__drop:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .seedvale-inventory__empty {
        font-size: 13px;
        opacity: 0.6;
      }
      .seedvale-inventory__hint {
        margin-top: 16px;
        font-size: 11px;
        opacity: 0.6;
      }
      .npc-label {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(20, 24, 28, 0.72);
        color: #f4f7fa;
        font-size: 11px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }
      .npc-label__name {
        text-align: center;
      }
      .npc-label__bars {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .npc-label__bar {
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.45);
      }
      .npc-label__bar-fill {
        height: 100%;
        width: 100%;
      }
      .npc-label__bar--hp .npc-label__bar-fill {
        background: #e05555;
      }
      .npc-label__bar--stamina .npc-label__bar-fill {
        background: #e0c040;
      }
      .npc-label--highlighted {
        /* box-shadow (not border) so the glow never shifts label layout/position. */
        box-shadow:
          0 0 0 1px rgba(255, 196, 92, 0.9),
          0 0 10px 2px rgba(255, 196, 92, 0.5);
      }

      /* --- Touch controls (joystick / look-drag / action buttons) --- */
      /* IMPORTANT: `.seedvale-touch` is the *component root* of the touch
         overlay only. Never reuse this class as a state/marker class on <body>
         (use `body.seedvale-touch-device`, set by createApp) — `pointer-events`
         is an inherited property, so `pointer-events: none` landing on <body>
         silently makes the entire document untappable except for the few nodes
         that re-enable it explicitly. */
      .seedvale-touch {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }
      .seedvale-touch__look {
        position: absolute;
        inset: 0;
        touch-action: none;
        pointer-events: auto;
      }
      .seedvale-touch__joystick {
        position: absolute;
        left: max(20px, env(safe-area-inset-left));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(20, 24, 28, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        touch-action: none;
        pointer-events: auto;
      }
      .seedvale-touch__joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin-left: -25px;
        margin-top: -25px;
        border-radius: 50%;
        background: rgba(242, 246, 250, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.35);
        pointer-events: none;
        will-change: transform;
      }
      /* While a full-screen modal is open, hard-disable joystick/look so a tap
         meant for the modal cannot also drive movement underneath it. Action
         buttons live in Vue (`TouchChrome`) and disable via store state. */
      .seedvale-touch--disabled * {
        pointer-events: none !important;
      }
      body.seedvale-touch-device .seedvale-interact-prompt {
        bottom: 160px;
      }

      /* --- Small screens: keep modal panels within the viewport --- */
      @media (max-width: 700px), (max-height: 500px) {
        .seedvale-pause__panel,
        .seedvale-npc-dialog__panel,
        .seedvale-quest-log__panel,
        .seedvale-inventory__panel {
          min-width: 0;
          width: min(420px, calc(100vw - 32px));
          max-width: calc(100vw - 32px);
          max-height: calc(100dvh - 32px);
          padding: 18px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="seedvale-rotate-hint">
      <div class="seedvale-rotate-hint__icon">🔄</div>
      <div class="seedvale-rotate-hint__text">Obróć urządzenie poziomo, aby wygodniej sterować postacią.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
